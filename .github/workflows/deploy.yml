name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, and mint the token Pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so CI typechecks before publishing.
      - run: npm run build

      # enablement turns Pages on via the API if it isn't already, so a fresh repo
      # doesn't need the Settings toggle flipped before the first run. It needs the
      # pages: write permission above, and Pages to be available for the account —
      # private repos on a free plan aren't, and there you must enable it by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
